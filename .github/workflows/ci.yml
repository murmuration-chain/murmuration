name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Validate genesis params are valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('genesis/params.json','utf8')); console.log('genesis/params.json OK')"
      - name: Unit tests
        run: npm test
      - name: End-to-end testnet
        run: npm run testnet
