name: Governance

# Enforces the rule in GOVERNANCE.md as a commit status ("governance") on each PR:
#   - normal change:            >= 2 member approvals, open >= 24h
#   - rules / constitution:     >= 3 member approvals, open >= 48h
#   - and no member "changes requested"
# Members are read from MEMBERS.md. Pair this with branch protection on `main`
# (require the "governance" status to pass) so it actually gates merging.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed, edited]
  schedule:
    - cron: '17 * * * *' # hourly, so the time gate is re-checked as PRs age
  workflow_dispatch:

permissions:
  statuses: write
  pull-requests: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const RULES_RE = /^(spec\/|genesis\/|GOVERNANCE\.md$|MEMBERS\.md$|\.github\/)/;

            async function members() {
              const { data } = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'MEMBERS.md' });
              const text = Buffer.from(data.content, 'base64').toString('utf8');
              const set = new Set();
              for (const m of text.matchAll(/\|\s*@([A-Za-z0-9-]+)\s*\|/g)) set.add(m[1].toLowerCase());
              return set;
            }

            async function evaluate(pr, memberSet) {
              // changed files -> required thresholds
              const files = await github.paginate(github.rest.pulls.listFiles, { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number });
              const touchesRules = files.some(f => RULES_RE.test(f.filename));
              const needApprovals = touchesRules ? 3 : 2;
              const needHours = touchesRules ? 48 : 24;

              // latest review state per member
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number });
              const latest = new Map();
              for (const r of reviews) {
                const u = (r.user?.login || '').toLowerCase();
                if (!memberSet.has(u)) continue;
                if (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED') latest.set(u, r.state);
              }
              const approvals = [...latest.values()].filter(s => s === 'APPROVED').length;
              const changesRequested = [...latest.values()].filter(s => s === 'CHANGES_REQUESTED').length;

              const hoursOpen = (Date.now() - new Date(pr.created_at).getTime()) / 36e5;

              let state = 'success';
              const reasons = [];
              if (changesRequested > 0) { state = 'failure'; reasons.push(`${changesRequested} member(s) requested changes`); }
              if (approvals < needApprovals) { state = 'failure'; reasons.push(`${approvals}/${needApprovals} member approvals`); }
              if (hoursOpen < needHours) { state = (state === 'failure' ? 'failure' : 'pending'); reasons.push(`open ${hoursOpen.toFixed(1)}h/${needHours}h`); }

              const kind = touchesRules ? 'rules' : 'normal';
              const description = state === 'success'
                ? `passed (${kind}): ${approvals}/${needApprovals} approvals, ${hoursOpen.toFixed(0)}h`
                : `not yet (${kind}): ` + reasons.join('; ');

              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner, repo: context.repo.repo, sha: pr.head.sha,
                state, context: 'governance', description: description.slice(0, 140),
              });
              return { number: pr.number, state, description };
            }

            const memberSet = await members();
            let prs = [];
            if (context.payload.pull_request) {
              prs = [context.payload.pull_request];
            } else {
              prs = await github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            }
            for (const pr of prs) {
              const out = await evaluate(pr, memberSet);
              core.info(`PR #${out.number}: ${out.state} — ${out.description}`);
            }
